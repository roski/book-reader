name: book_reader
description: "A clean, offline-first Flutter eBook reader application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picker
  file_picker: ^8.0.0

  # EPUB parsing
  epubx: ^4.0.0

  # HTML rendering (for EPUB content)
  flutter_html: ^3.0.0-beta.2

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Path utilities
  path_provider: ^2.1.2

  # UUID generation
  uuid: ^4.4.0

  # Progress indicators
  percent_indicator: ^4.2.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.10
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
